name: Mise à jour de l'agenda

on:
  schedule:
    # Tous les jours à 6h00 (heure belge d'été) — et donc le jeudi matin aussi
    - cron: "0 4 * * *"
  workflow_dispatch:      # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths: ["agenda.py", ".github/workflows/agenda.yml"]

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lire le site de la commune et générer agenda + messages
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python agenda.py

      - name: Publier les changements
        run: |
          git config user.name  "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Agenda mis à jour $(date +'%d/%m/%Y %H:%M')"
            git push
          fi
